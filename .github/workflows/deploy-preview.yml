name: Deploy preview

# A shareable test site for manual testing from other machines (18/11/2026).
# Vercel's own git integration stopped creating Preview deployments after
# 28/09/2026, so this deploys the `preview` branch with the same Vercel
# secrets the production workflow uses — but WITHOUT --prod, so Vercel builds
# it as a Preview deployment with the Preview-scoped env vars (fgrapher-dev
# database, never fgrapher-prod). No migration step: the dev database is
# migrated locally per CLAUDE.md's dev → preview → production rule.
on:
  push:
    branches: [preview]
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] \
            || { echo "::error title=Vercel secrets::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must be repository secrets (not only production-environment secrets)."; exit 1; }
          url=$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "## Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview URL::$url"

          # Point the one fixed test address at THIS build. `vercel deploy`
          # only returns a new per-deployment URL each time; nothing moved
          # the address people bookmark, so it could keep serving an older
          # build while every run here reported success (20/11/2026). The
          # second name is tried if Vercel will not let the first be set by
          # hand. A failure here is reported, not fatal: the build is still
          # reachable at the URL above.
          # The CLI's `alias` command needs to load the token's user, which
          # this deploy token cannot do ("User not found"), so the REST API
          # is used instead. First ask which addresses Vercel gave this build
          # by itself; set the fixed one only if it is not among them.
          api() { curl -sS -m 60 -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          field() { python3 -c "import sys,json; d=json.load(sys.stdin); print($1)" 2>/dev/null; }
          host="${url#https://}"
          fixed="fgrapher-git-preview-bao-he.vercel.app"
          q="?teamId=$VERCEL_ORG_ID"
          dep=$(api "https://api.vercel.com/v13/deployments/$host$q")
          if [ -z "$(echo "$dep" | field "d.get('id','')")" ]; then
            q=""
            dep=$(api "https://api.vercel.com/v13/deployments/$host")
          fi
          id=$(echo "$dep" | field "d.get('id','')")
          auto=$(echo "$dep" | field "' '.join(d.get('alias') or [])")
          echo "::notice title=Addresses Vercel gave this build::${auto:-none} (lookup: $(echo "$dep" | field "(d.get('error') or {}).get('message','ok')"))"
          if echo " $auto " | grep -q " $fixed "; then
            echo "::notice title=Fixed address now serves this build::https://$fixed (assigned by Vercel)"
          elif [ -n "$id" ]; then
            res=$(api -X POST -d "{\"alias\":\"$fixed\"}" "https://api.vercel.com/v2/deployments/$id/aliases$q")
            if [ -n "$(echo "$res" | field "d.get('alias','')")" ]; then
              echo "Fixed address: https://$fixed" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Fixed address now serves this build::https://$fixed (set by this workflow)"
            else
              echo "::warning title=Fixed address not updated::Use $url directly. Vercel said: $(echo "$res" | field "(d.get('error') or {}).get('message','?')" | cut -c1-200)"
            fi
          else
            echo "::warning title=Fixed address not updated::Use $url directly. The deployment could not be looked up."
          fi
