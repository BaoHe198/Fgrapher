name: Deploy preview

# A shareable test site for manual testing from other machines (18/11/2026).
# Vercel's own git integration stopped creating Preview deployments after
# 28/09/2026, so this deploys the `preview` branch with the same Vercel
# secrets the production workflow uses — but WITHOUT --prod, so Vercel builds
# it as a Preview deployment with the Preview-scoped env vars (fgrapher-dev
# database, never fgrapher-prod). No migration step: the dev database is
# migrated locally per CLAUDE.md's dev → preview → production rule.
on:
  push:
    branches: [preview]
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] \
            || { echo "::error title=Vercel secrets::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must be repository secrets (not only production-environment secrets)."; exit 1; }
          url=$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "## Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview URL::$url"

          # Point the one fixed test address at THIS build. `vercel deploy`
          # only returns a new per-deployment URL each time; nothing moved
          # the address people bookmark, so it could keep serving an older
          # build while every run here reported success (20/11/2026). The
          # second name is tried if Vercel will not let the first be set by
          # hand. A failure here is reported, not fatal: the build is still
          # reachable at the URL above.
          fixed=""
          for name in fgrapher-git-preview-bao-he.vercel.app fgrapher-web-thu-bao-he.vercel.app; do
            if npx vercel@latest alias set "$url" "$name" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
              fixed="https://$name"
              break
            fi
          done
          if [ -n "$fixed" ]; then
            echo "Fixed address: $fixed" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Fixed address now serves this build::$fixed"
          else
            echo "::warning title=Fixed address not updated::Could not point a fixed address at $url; use that URL directly."
          fi
