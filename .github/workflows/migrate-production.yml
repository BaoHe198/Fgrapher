name: Migrate production

# Same shape as migrate-staging.yml, but gated: the `production`
# GitHub Environment (Settings → Environments → production) must exist
# with a required reviewer configured, or this job just hangs waiting
# for an approval nobody can give — see the setup note at the bottom of
# this file. Not created by this workflow; that's a one-time manual step.
on:
  push:
    branches: [master]
  # Manual escape hatch — e.g. the diff-based check below missed a batch
  # of migrations that landed via a multi-commit fast-forward push (see
  # the git blame on this line for the incident), or you just want to
  # confirm production is at `prisma migrate status`'s reported state
  # without waiting for a new push. GitHub → Actions → Migrate production
  # → Run workflow.
  workflow_dispatch:
    inputs:
      force:
        description: "Run migrate deploy even if no migration files changed in the diff"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production # <-- pauses here for manual approval
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not fetch-depth: 2 — a push can fast-forward
          # master by many commits at once (e.g. merging develop in), and
          # the diff below needs to see the *whole* pushed range, not just
          # the tip commit vs its immediate parent.
          fetch-depth: 0

      - name: Check whether migrations changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          # All-zeros `before` means this ref didn't exist prior to the
          # push (e.g. a new branch) — nothing to diff against, so treat
          # it as changed to be safe rather than silently skipping.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" -- prisma/migrations | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Log current migration status before applying
        if: steps.check.outputs.changed == 'true'
        # `prisma migrate status` exits 1 whenever there are unapplied
        # migrations — the exact, expected state right before this
        # workflow's whole reason for existing (running `migrate deploy`
        # below). This step is purely informational (its output is
        # already visible in the log above), so a non-zero exit here must
        # not fail the job and block the real Apply step from running.
        run: npx prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Apply migrations to production
        if: steps.check.outputs.changed == 'true'
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: On failure, stop and alert clearly
        if: failure() && steps.check.outputs.changed == 'true'
        run: |
          echo "## :rotating_light: Production migration FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "Do not re-run this workflow blindly. See docs/MIGRATIONS.md \"Rollback\" section — check _prisma_migrations, consider a PITR restore, and use \`prisma migrate resolve\` before retrying." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Summarize
        if: steps.check.outputs.changed == 'true' && success()
        run: |
          echo "## Migrations applied to production" >> "$GITHUB_STEP_SUMMARY"
          npx prisma migrate status >> "$GITHUB_STEP_SUMMARY" || true

      - name: No migration changes
        if: steps.check.outputs.changed == 'false'
        run: echo "No changes under prisma/migrations/ in this push — skipping." >> "$GITHUB_STEP_SUMMARY"

# One-time manual setup required (not done by this workflow):
#   GitHub → Settings → Environments → New environment → name it
#   "production" → Required reviewers → add yourself (and anyone else
#   who should approve production migrations). Without this, the
#   `environment: production` line above still works, it just never
#   pauses for approval — the job runs immediately, which defeats the
#   purpose. Confirm the environment protection rule is actually saved
#   before relying on it.
