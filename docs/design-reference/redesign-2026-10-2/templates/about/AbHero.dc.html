<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-surface="darkroom" aria-labelledby="ab-title" style="background:var(--dr-bg);color:var(--dr-text)">
<div style="max-width:1440px;margin:0 auto;padding:clamp(40px,6vw,96px) clamp(20px,4vw,64px) clamp(40px,5vw,72px);display:flex;flex-direction:column;gap:clamp(28px,4vw,56px)">
<div style="display:flex;flex-direction:column;gap:clamp(16px,2vw,28px)">
<span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">KHUNG 00 · GIỚI THIỆU F</span>
<h1 id="ab-title" lang="vi" style="margin:0;max-width:1180px;font-family:var(--font-display);font-weight:600;font-size:clamp(44px,calc(20px + 5.4vw),96px);line-height:.95;letter-spacing:-.03em;text-wrap:balance">Nơi khách tìm đúng người giữ lại khoảnh khắc</h1>
<div style="display:flex;flex-wrap:wrap;gap:20px 48px;align-items:flex-end;justify-content:space-between">
<p style="margin:0;max-width:560px;font:var(--text-body-lg);color:var(--dr-text-2);text-wrap:pretty">Fgrapher là nơi đặt lịch với nhiếp ảnh gia, người quay phim, chuyên viên trang điểm, người mẫu, studio và tiệm cho thuê trang phục. Mọi người trên đây đã xác minh danh tính.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px"><x-import component-from-global-scope="Fgrapher.Button" variant="accent" size="lg">Tìm nghệ sĩ</x-import><x-import component-from-global-scope="Fgrapher.Button" variant="outline" size="lg">Tôi là nghệ sĩ</x-import></div>
</div>
</div>
<figure role="group" aria-label="Tờ contact sheet 12 khung: nhiếp ảnh, quay phim, trang điểm, studio, người mẫu, thuê trang phục" style="margin:0;display:flex;flex-direction:column;gap:0;border:1px solid var(--dr-line);background:var(--dr-surface)">
<div aria-hidden="true" style="display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--dr-line);font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)"><span>FGRAPHER 400</span><span>▸ 01–02</span><span>12 KHUNG</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(104px,14vw,200px),1fr));gap:2px;padding:2px;background:var(--dr-line)">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="12"><div style="display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px;background:var(--dr-surface)">
<div style="aspect-ratio:1;display:grid;place-items:center;background:var(--dr-bg)">
<sc-if value="{{ f.ok }}" hint-placeholder-val="{{ true }}"><img data-dev="" src="{{ f.src }}" width="{{ f.w }}" height="{{ f.h }}" alt="{{ f.alt }}" style="display:block;max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 0 0 1px var(--dr-line)"></sc-if>
<sc-if value="{{ f.loading }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:100%;height:100%;background:var(--dr-raised)"></span></sc-if>
<sc-if value="{{ f.err }}" hint-placeholder-val="{{ false }}"><span style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dr-text-3);font-size:12px;text-align:center"><x-import component-from-global-scope="Fgrapher.FrameMark" size="28" hint-size="28px,28px"></x-import>Không tải được</span></sc-if>
</div>
<span style="display:flex;justify-content:space-between;gap:6px;font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)"><span>{{ f.num }}</span><span style="text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.role }}</span></span>
</div></sc-for>
</div>
</figure>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state || '';
    const roles = ['NHIẾP ẢNH', 'QUAY PHIM', 'TRANG ĐIỂM', 'STUDIO', 'NGƯỜI MẪU', 'THUÊ TRANG PHỤC'];
    const alts = ['Cô dâu dưới mưa ở Hội An', 'Máy quay trên tay người quay phim', 'Chuyên viên trang điểm cho cô dâu', 'Phông nền trong studio', 'Người mẫu chụp ngoài trời', 'Áo dài treo trên giá', 'Chân dung ánh sáng tự nhiên', 'Quay phim sự kiện', 'Trang điểm chụp kỷ yếu', 'Studio chụp sản phẩm', 'Người mẫu thời trang', 'Áo dài Tết'];
    const R = [[3, 2], [2, 3], [4, 5], [1, 1], [2, 3], [4, 5], [3, 2], [16, 9], [4, 5], [1, 1], [2, 3], [3, 2]];
    return {
      frames: R.map(([a, b], i) => { const L = 720, w = a >= b ? L : Math.round(L * a / b), h = a >= b ? Math.round(L * b / a) : L; return { src: `https://picsum.photos/seed/fgab-${i}/${w}/${h}`, w, h, alt: alts[i], num: '0' + (1 + Math.floor(i / 6)) + 'ABCDEF'[i % 6], role: roles[i % 6], ok: st !== 'loading' && !(st === 'error' && i === 4), loading: st === 'loading', err: st === 'error' && i === 4 }; })
    };
  }
}
</script>
</body>
</html>
