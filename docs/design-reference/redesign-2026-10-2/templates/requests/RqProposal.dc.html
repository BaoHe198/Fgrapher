<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article ref="{{ rootRef }}" aria-labelledby="{{ hid }}" style="display:flex;flex-direction:column;gap:16px;padding:18px;border:1px solid var(--border-subtle);border-radius:var(--fg-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-family:var(--font-body);min-width:0">
<sc-if value="{{ isChosen }}" hint-placeholder-val="{{ false }}"><span style="align-self:flex-start;padding:5px 10px;border-radius:4px;background:var(--brand-primary);color:var(--text-on-brand);font:700 12px/1 var(--font-mono);letter-spacing:.12em">ĐÃ CHỌN</span></sc-if>
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<div style="display:flex;align-items:center;gap:12px;min-width:0"><x-import component-from-global-scope="Fgrapher.Avatar" hint-size="40px,40px"><x-import component-from-global-scope="Fgrapher.AvatarImage" src="{{ p.avatar }}" alt=""></x-import><x-import component-from-global-scope="Fgrapher.AvatarFallback">{{ p.initials }}</x-import></x-import><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><strong id="{{ hid }}" style="font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ p.name }}</strong><span style="font-size:13px;line-height:1.35;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ p.role }} · {{ p.area }}</span></span></div>
<sc-if value="{{ canCompare }}" hint-placeholder-val="{{ true }}"><button type="button" data-cmp="" aria-pressed="{{ cmpOn }}" onClick="{{ toggle }}" style="flex:none;min-height:36px;padding:0 12px;border:1px solid var(--border-default);border-radius:999px;background:transparent;color:var(--text-primary);font:600 13px/1 var(--font-body);cursor:pointer;transition:background-color 150ms,color 150ms">{{ cmpLabel }}</button></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:4px"><span style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><strong style="font:600 30px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums">{{ p.price }}</strong><span style="font-size:13px;color:var(--text-secondary)">giá đề xuất</span></span><span style="font-size:14px;line-height:1.45;color:var(--text-secondary)">{{ p.includes }}</span></div>
<div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;line-height:1.4"><sc-if value="{{ hasRating }}" hint-placeholder-val="{{ true }}"><span><strong>★ {{ p.rating }}</strong> <span style="color:var(--text-secondary)">· {{ p.reviews }} đánh giá</span></span></sc-if><sc-if value="{{ noRating }}" hint-placeholder-val="{{ false }}"><span style="color:var(--text-secondary)">Chưa có đánh giá</span></sc-if><span style="color:var(--text-secondary)">Gửi sau {{ p.after }} · {{ p.sentAt }}</span></div>
<div ref="{{ stripRef }}" role="group" aria-label="Ảnh mẫu" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px;background:var(--dr-line);border-radius:4px"><sc-for list="{{ frames }}" as="f" hint-placeholder-count="3"><button type="button" onClick="{{ f.open }}" aria-label="Xem ảnh mẫu {{ f.num }}" style="display:flex;flex-direction:column;gap:4px;padding:4px 4px 6px;border:0;background:var(--dr-surface);cursor:zoom-in"><span style="aspect-ratio:1;display:grid;place-items:center;background:var(--dr-bg)"><img data-dev="" src="{{ f.src }}" alt="{{ f.alt }}" loading="lazy" style="display:block;max-width:100%;max-height:100%"></span><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ f.num }}</span></button></sc-for></div>
<div style="display:flex;flex-direction:column;gap:6px"><p ref="{{ msgRef }}" style="margin:0;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ p.msg }}</p><sc-if value="{{ showMore }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ more }}" aria-expanded="{{ moreOpen }}" style="align-self:flex-start;min-height:32px;padding:0;border:0;background:none;color:var(--text-link);font:600 14px/1 var(--font-body);cursor:pointer">{{ moreLabel }}</button></sc-if></div>
<sc-if value="{{ canAct }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:auto"><x-import component-from-global-scope="Fgrapher.Button" variant="accent" size="md" on-click="{{ choose }}">Chọn đề xuất này</x-import><x-import component-from-global-scope="Fgrapher.Button" variant="outline" size="md" on-click="{{ message }}">Nhắn tin</x-import></div></sc-if>
<sc-if value="{{ msgOnly }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:auto"><x-import component-from-global-scope="Fgrapher.Button" variant="outline" size="md" on-click="{{ message }}">Nhắn tin</x-import><span style="font-size:13px;color:var(--text-secondary)">{{ closedNote }}</span></div></sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:620},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Proposal&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;expired&quot;,&quot;chosen-this&quot;,&quot;chosen-other&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cmp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;},&quot;onChoose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;},&quot;onMessage&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { more: false, clamp: false };
  rootRef = React.createRef(); stripRef = React.createRef(); msgRef = React.createRef();
  componentDidMount() { this.paint(); const m = this.msgRef.current; if (m && m.scrollHeight > m.clientHeight + 2) this.setState({ clamp: true }); }
  componentDidUpdate() { this.paint(); }
  paint() {
    const r = this.rootRef.current; if (!r) return;
    const mode = this.props.mode || 'open';
    r.style.borderStyle = mode === 'expired' ? 'dashed' : 'solid';
    r.style.borderColor = mode === 'chosen-this' ? 'var(--brand-primary)' : this.props.cmp ? 'var(--brand-accent)' : 'var(--border-subtle)';
    r.style.boxShadow = mode === 'chosen-this' ? 'inset 0 0 0 1px var(--brand-primary)' : this.props.cmp ? 'inset 0 0 0 1px var(--brand-accent)' : 'none';
    const b = r.querySelector('[data-cmp]'); if (b) { const on = !!this.props.cmp; b.style.background = on ? 'var(--brand-primary)' : 'transparent'; b.style.color = on ? 'var(--text-on-brand)' : 'var(--text-primary)'; }
    const m = this.msgRef.current; if (m) m.style.webkitLineClamp = this.state.more ? 'unset' : '3';
  }
  renderVals() {
    const p = this.props.p || { imgs: [] }, mode = this.props.mode || 'open';
    return {
      rootRef: this.rootRef, stripRef: this.stripRef, msgRef: this.msgRef, p, hid: 'rqp-' + p.id,
      isChosen: mode === 'chosen-this', canCompare: mode === 'open', cmpOn: this.props.cmp ? 'true' : 'false', cmpLabel: this.props.cmp ? '✓ So sánh' : 'So sánh',
      toggle: () => this.props.onToggle && this.props.onToggle(p.id),
      hasRating: p.reviews > 0, noRating: !(p.reviews > 0),
      frames: (p.imgs || []).map((src, i) => ({ src, alt: `Ảnh mẫu ${i + 1} của ${p.name}`, num: '01' + 'ABC'[i], open: e => { const im = e.currentTarget.querySelector('img'); const g = [...this.stripRef.current.querySelectorAll('img')]; window.fgKit && window.fgKit.lightbox(im, { group: g, label: j => '01' + 'ABC'[j] }); } })),
      showMore: this.state.clamp, moreOpen: this.state.more ? 'true' : 'false', moreLabel: this.state.more ? 'Thu gọn' : 'Xem thêm', more: () => this.setState(s => ({ more: !s.more })),
      canAct: mode === 'open', msgOnly: mode !== 'open', closedNote: mode === 'expired' ? 'Yêu cầu đã hết hạn' : mode === 'chosen-this' ? 'Hẹn lịch và đặt cọc trực tiếp với nghệ sĩ' : 'Bạn đã chọn nghệ sĩ khác',
      choose: () => this.props.onChoose && this.props.onChoose(p.id), message: () => this.props.onMessage && this.props.onMessage(p.id)
    };
  }
}
</script>
</body>
</html>
