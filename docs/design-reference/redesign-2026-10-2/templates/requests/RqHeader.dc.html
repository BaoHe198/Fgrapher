<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:20;background:var(--green-900);box-shadow:0 1px 0 hsl(0 0% 100% / .06)">
<div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,64px);height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px">
<a href="#" aria-label="Fgrapher, trang chủ" style="display:flex;align-items:center;min-height:44px;--text-primary:var(--gold-50)"><x-import component-from-global-scope="Fgrapher.LogoFull" hint-size="110px,28px"></x-import></a>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><nav aria-label="Chính" style="display:flex;align-items:center;gap:4px"><a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:var(--gold-50);text-decoration:none">Tìm nghệ sĩ</a><a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:var(--gold-50);text-decoration:none">Bản đồ F</a><a href="#" aria-current="page" style="display:flex;align-items:center;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;color:var(--gold-300);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px">Đặt lịch F</a></nav></sc-if>
<sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onLogin }}" style="display:flex;align-items:center;min-height:44px;padding:0 12px;font-size:15px;font-weight:600;color:var(--gold-50);text-decoration:none">Đăng nhập</a></sc-if>
<sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:10px;color:var(--gold-50);font-size:14px;font-weight:600"><x-import component-from-global-scope="Fgrapher.Avatar" size="sm" hint-size="32px,32px"><x-import component-from-global-scope="Fgrapher.AvatarFallback">TH</x-import></x-import><sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><span>Thu Hà</span></sc-if></span></sc-if>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;isMobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { isDesktop: !this.props.isMobile, loggedIn: !!this.props.loggedIn, loggedOut: !this.props.loggedIn, onLogin: e => { e.preventDefault(); this.props.onLogin && this.props.onLogin(); } };
  }
}
</script>
</body>
</html>
