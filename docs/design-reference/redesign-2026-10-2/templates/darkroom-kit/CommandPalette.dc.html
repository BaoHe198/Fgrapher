<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isInline }}" hint-placeholder-val="{{ true }}"><div style="width:100%;height:440px;border:1px solid var(--border-default);border-radius:var(--fg-radius-lg);box-shadow:var(--shadow-lg);overflow:hidden"><dc-import name="CpPanel" preset-query="{{ presetQuery }}" preset-state="{{ presetState }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div></sc-if>
<sc-if value="{{ isInlineSheet }}" hint-placeholder-val="{{ false }}"><div style="position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div aria-hidden="true" style="position:absolute;inset:0;background:var(--dr-scrim)"></div><div style="position:relative;height:88%;border:1px solid var(--border-default);border-bottom:0;border-radius:var(--fg-radius-xl) var(--fg-radius-xl) 0 0;box-shadow:var(--shadow-lg);overflow:hidden"><dc-import name="CpPanel" sheet="{{ true }}" preset-query="{{ presetQuery }}" preset-state="{{ presetState }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div></div></sc-if>
<sc-if value="{{ isOverlay }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;padding-top:12vh"><div ref="{{ scrimRef }}" onClick="{{ close }}" aria-hidden="true" style="position:absolute;inset:0;background:var(--dr-scrim)"></div><div ref="{{ panelRef }}" role="dialog" aria-modal="true" aria-label="Tìm nhanh" style="position:relative;width:min(640px,calc(100% - 32px));height:min(520px,72vh);border:1px solid var(--border-default);border-radius:var(--fg-radius-lg);box-shadow:var(--shadow-lg);overflow:hidden"><dc-import name="CpPanel" auto-focus="{{ true }}" on-request-close="{{ close }}" preset-query="{{ presetQuery }}" preset-state="{{ presetState }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div></div></sc-if>
<sc-if value="{{ isOverlaySheet }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;justify-content:flex-end"><div ref="{{ scrimRef }}" onClick="{{ close }}" aria-hidden="true" style="position:absolute;inset:0;background:var(--dr-scrim)"></div><div ref="{{ panelRef }}" role="dialog" aria-modal="true" aria-label="Tìm nhanh" style="position:relative;height:88vh;border:1px solid var(--border-default);border-bottom:0;border-radius:var(--fg-radius-xl) var(--fg-radius-xl) 0 0;box-shadow:var(--shadow-lg);overflow:hidden"><dc-import name="CpPanel" sheet="{{ true }}" auto-focus="{{ true }}" on-request-close="{{ close }}" preset-query="{{ presetQuery }}" preset-state="{{ presetState }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:480},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inline&quot;,&quot;inline-sheet&quot;,&quot;overlay&quot;],&quot;default&quot;:&quot;inline&quot;,&quot;tsType&quot;:&quot;'inline'|'inline-sheet'|'overlay'&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;presetQuery&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;presetState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;''|'loading'|'error'&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth };
  panelRef = React.createRef(); scrimRef = React.createRef();
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); if (this.props.mode === 'overlay' && this.props.open) this.enter(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); document.documentElement.style.overflow = ''; }
  componentDidUpdate(pp) {
    if (this.props.mode !== 'overlay') return;
    if (this.props.open && !pp.open) this.enter();
    if (!this.props.open && pp.open) document.documentElement.style.overflow = '';
  }
  sheet() { return this.state.w < 768; }
  reduced() { return window.fgKit ? window.fgKit.reduced() : false; }
  enter() {
    document.documentElement.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      const p = this.panelRef.current, s = this.scrimRef.current; if (!p || !p.animate || this.reduced()) return;
      if (this.sheet()) p.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(0,0,.2,1)' });
      else p.animate([{ opacity: 0, transform: 'scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'cubic-bezier(0,0,.2,1)' });
      s && s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260 });
    });
  }
  close() {
    const done = () => this.props.onClose && this.props.onClose();
    const p = this.panelRef.current, s = this.scrimRef.current;
    if (!p || !p.animate || this.reduced()) return done();
    s && s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    p.animate(this.sheet() ? [{ transform: 'none' }, { transform: 'translateY(100%)' }] : [{ opacity: 1 }, { opacity: 0, transform: 'scale(.98)' }], { duration: this.sheet() ? 200 : 150, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).onfinish = done;
  }
  renderVals() {
    const mode = this.props.mode || 'inline', open = !!this.props.open, sh = this.sheet();
    return {
      isInline: mode === 'inline', isInlineSheet: mode === 'inline-sheet',
      isOverlay: mode === 'overlay' && open && !sh, isOverlaySheet: mode === 'overlay' && open && sh,
      presetQuery: this.props.presetQuery || '', presetState: this.props.presetState || '',
      panelRef: this.panelRef, scrimRef: this.scrimRef, close: () => this.close()
    };
  }
}
</script>
</body>
</html>
