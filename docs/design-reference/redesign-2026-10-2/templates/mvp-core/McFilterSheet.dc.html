<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;display:flex;flex-direction:column;background:var(--bg-surface);color:var(--text-primary);font-family:var(--font-body)">
<sc-if value="{{ isSheet }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="align-self:center;width:40px;height:4px;margin-top:8px;border-radius:999px;background:var(--border-default)"></span></sc-if>
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px;border-bottom:1px solid var(--border-subtle)"><h2 id="mc-f-t" style="margin:0;font:600 20px/1.2 var(--font-display)">Bộ lọc</h2><button type="button" onClick="{{ close }}" aria-label="Đóng bộ lọc" style="width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:999px;background:transparent;color:var(--text-primary);cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:24px">
<fieldset style="margin:0;padding:0;border:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px"><legend style="padding:0;margin-bottom:10px;font-size:15px;font-weight:600">Khu vực và ngày</legend>
<label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-secondary)">Tỉnh/thành<select value="{{ f.prov }}" onChange="{{ onProv }}" style="min-height:48px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--fg-radius-md);background:var(--bg-surface);color:var(--text-primary);font:500 15px/1 var(--font-body)"><option value="">Mọi tỉnh/thành</option><option>Thành phố Hồ Chí Minh</option><option>Thành phố Hà Nội</option><option>Thành phố Đà Nẵng</option></select></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-secondary);min-width:0">Ngày cần chụp<input type="date" value="{{ f.date }}" min="2026-10-02" onChange="{{ onDate }}" style="min-height:48px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--fg-radius-md);background:var(--bg-surface);color:var(--text-primary);font:500 15px/1 var(--font-body);color-scheme:light dark;min-width:0"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-secondary);min-width:0">Giờ bắt đầu<select value="{{ f.time }}" onChange="{{ onTime }}" style="min-height:48px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--fg-radius-md);background:var(--bg-surface);color:var(--text-primary);font:500 15px/1 var(--font-body)"><option value="">Giờ bất kỳ</option><option>06:00</option><option>08:00</option><option>10:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></label>
</fieldset>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4"><fieldset style="margin:0;padding:0;border:0"><legend style="padding:0;margin-bottom:10px;font-size:15px;font-weight:600">{{ g.title }}</legend><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="5"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="min-height:44px;padding:0 14px;border-radius:999px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font:600 14px/1 var(--font-body);cursor:pointer">{{ o.label }}</button></sc-for></div></fieldset></sc-for>
</div>
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px {{ pb }}px;border-top:1px solid var(--border-subtle);background:var(--bg-surface)"><button type="button" onClick="{{ clear }}" style="min-height:48px;padding:0 8px;border:0;background:transparent;color:var(--text-primary);font:600 15px/1 var(--font-body);text-decoration:underline;text-underline-offset:4px;cursor:pointer">Xoá tất cả</button><button type="button" onClick="{{ close }}" style="flex:1;min-height:48px;padding:0 16px;border:0;border-radius:var(--fg-radius-md);background:var(--gold-400);color:var(--gold-900);font:700 16px/1 var(--font-body);cursor:pointer">{{ seeLabel }}</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:760},&quot;f&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Filters&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sheet&quot;,&quot;dialog&quot;],&quot;default&quot;:&quot;sheet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;safe&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p)=&gt;void&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.f || { styles: [], services: [] }, D = window.mcData || { styles: [], svcs: [], budgets: [] };
    const ch = p => this.props.onChange && this.props.onChange(p);
    const opt = (label, on, pick) => ({ label, on: on ? 'true' : 'false', pick, bd: on ? 'var(--brand-primary)' : 'var(--border-default)', bg: on ? 'var(--brand-primary)' : 'var(--bg-surface)', fg: on ? 'var(--text-on-brand)' : 'var(--text-primary)' });
    const tog = (key, v) => { const a = f[key] || []; ch({ [key]: a.includes(v) ? a.filter(x => x !== v) : [...a, v] }); };
    const n = this.props.count ?? 0;
    return {
      f, isSheet: this.props.mode !== 'dialog', pb: 12 + (this.props.safe || 0),
      onProv: e => ch({ prov: e.target.value }), onDate: e => ch({ date: e.target.value }), onTime: e => ch({ time: e.target.value }),
      groups: [
        { title: 'Phong cách', opts: D.styles.map(s => opt(s, (f.styles || []).includes(s), () => tog('styles', s))) },
        { title: 'Ngân sách mỗi buổi', opts: D.budgets.map(([k, l]) => opt(l, f.budget === k, () => ch({ budget: f.budget === k ? '' : k }))) },
        { title: 'Đánh giá', opts: [['4.5', 'Từ 4,5 ★'], ['4.8', 'Từ 4,8 ★']].map(([k, l]) => opt(l, f.rating === k, () => ch({ rating: f.rating === k ? '' : k }))) },
        { title: 'Dịch vụ kèm', opts: D.svcs.map(([k, l]) => opt(l, (f.services || []).includes(k), () => tog('services', k))) }
      ],
      seeLabel: n > 0 ? `Xem ${n} kết quả` : 'Không có kết quả',
      clear: () => this.props.onClear && this.props.onClear(), close: () => this.props.onClose && this.props.onClose()
    };
  }
}
</script>
</body>
</html>
