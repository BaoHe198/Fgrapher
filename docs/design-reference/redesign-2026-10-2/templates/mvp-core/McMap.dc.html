<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:{{ h }};overflow:hidden;font-family:var(--font-body);color:var(--text-primary);background:var(--bg-page);display:flex">
<sc-if value="{{ isDesk }}" hint-placeholder-val="{{ false }}"><aside aria-label="Kết quả trên bản đồ" style="flex:none;width:420px;height:100%;display:flex;flex-direction:column;border-right:1px solid var(--border-subtle);background:var(--bg-page)">
<div style="padding:16px 0 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border-subtle)"><div style="display:flex;gap:8px;padding:0 16px"><button type="button" onClick="{{ openF }}" style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);text-align:left;cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong>{{ provS }}</strong><span style="color:var(--text-secondary)"> · Mọi ngày</span></span></button><button type="button" onClick="{{ openF }}" aria-label="Bộ lọc" style="flex:none;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button></div><dc-import name="McRail" items="{{ roleItems }}" value="{{ role }}" on-pick="{{ pickRole }}" label="Vai trò" hint-size="100%,44px"></dc-import></div>
<p role="status" aria-live="polite" style="margin:0;padding:12px 16px;font-size:15px;font-weight:600">{{ countTxt }}</p>
<div style="flex:1;overflow-y:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:20px"><sc-for list="{{ res }}" as="a" hint-placeholder-count="5"><div onMouseEnter="{{ a.hov }}" style="border-radius:var(--fg-radius-md)"><dc-import name="McCard" a="{{ a }}" layout="row" on-open="{{ open }}" hint-size="100%,140px"></dc-import></div></sc-for></div>
</aside></sc-if>
<div role="region" aria-label="Bản đồ minh hoạ" style="position:relative;flex:1;min-width:0;height:100%;background-color:var(--bg-sunken);background-image:linear-gradient(90deg,var(--border-subtle) 1px,transparent 1px),linear-gradient(var(--border-subtle) 1px,transparent 1px);background-size:56px 56px">
<span aria-hidden="true" style="position:absolute;left:-10%;top:52%;width:130%;height:16px;background:var(--bg-surface);transform:rotate(-8deg)"></span>
<span aria-hidden="true" style="position:absolute;left:40%;top:-10%;width:14px;height:130%;background:var(--bg-surface);transform:rotate(12deg)"></span>
<span aria-hidden="true" style="position:absolute;left:66%;top:22%;width:40%;height:34%;border-radius:40% 0 0 60%;background:var(--info-bg)"></span>
<sc-for list="{{ marks }}" as="k" hint-placeholder-count="8"><button type="button" onClick="{{ k.pick }}" aria-label="{{ k.aria }}" aria-pressed="{{ k.on }}" style="position:absolute;left:{{ k.x }};top:{{ k.y }};z-index:{{ k.z }};transform:translate(-50%,-100%);min-width:44px;min-height:44px;display:flex;align-items:flex-end;justify-content:center;padding:0;border:0;background:transparent;cursor:pointer"><span style="display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border:{{ k.bd }};border-radius:999px;background:{{ k.bg }};color:{{ k.fg }};box-shadow:var(--shadow-sm);font:700 13px/1 var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap"><sc-if value="{{ k.isOn }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{ k.price }}</span></button></sc-for>
<sc-if value="{{ isMob }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;right:0;top:0;z-index:20;padding:8px 0 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg-page);border-bottom:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)"><div style="display:flex;gap:8px;padding:0 16px"><button type="button" onClick="{{ openF }}" aria-haspopup="dialog" style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);text-align:left;cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong>{{ provS }}</strong><span style="color:var(--text-secondary)"> · Mọi ngày</span></span></button><button type="button" onClick="{{ openF }}" aria-haspopup="dialog" aria-label="Bộ lọc" style="flex:none;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button></div><dc-import name="McRail" items="{{ roleItems }}" value="{{ role }}" on-pick="{{ pickRole }}" label="Vai trò" hint-size="100%,44px"></dc-import></div></sc-if>
<sc-if value="{{ panned }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ searchArea }}" style="position:absolute;left:50%;top:{{ areaTop }}px;z-index:15;transform:translateX(-50%);min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--green-900);color:var(--gold-50);font:700 14px/1 var(--font-body);box-shadow:var(--shadow-md);white-space:nowrap;cursor:pointer">Tìm trong khu vực này</button></sc-if>
<sc-if value="{{ showCtrl }}" hint-placeholder-val="{{ true }}"><div role="group" aria-label="Điều khiển bản đồ" style="position:absolute;right:12px;bottom:{{ ctrlBottom }}px;z-index:15;display:flex;flex-direction:column;gap:8px;transition:bottom 240ms cubic-bezier(0,0,.2,1)"><button type="button" onClick="{{ locate }}" aria-label="Vị trí của tôi" style="width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--shadow-sm);cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button><div style="display:flex;flex-direction:column;gap:8px"><button type="button" aria-label="Phóng to" style="width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--shadow-sm);font:600 20px/1 var(--font-body);cursor:pointer">+</button><button type="button" aria-label="Thu nhỏ" style="width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--shadow-sm);font:600 20px/1 var(--font-body);cursor:pointer">−</button></div></div></sc-if>
<sc-if value="{{ isMob }}" hint-placeholder-val="{{ true }}"><section aria-label="Kết quả" style="position:absolute;left:0;right:0;bottom:0;z-index:25;height:{{ sheetH }};display:flex;flex-direction:column;border-radius:var(--fg-radius-xl) var(--fg-radius-xl) 0 0;background:var(--bg-surface);box-shadow:0 -8px 24px hsl(30 14% 5% / .14);transition:height 260ms cubic-bezier(0,0,.2,1);padding-bottom:{{ safe }}px">
<button type="button" onClick="{{ cycle }}" aria-expanded="{{ expanded }}" aria-label="{{ handleAria }}" style="flex:none;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer"><span aria-hidden="true" style="width:40px;height:4px;border-radius:999px;background:var(--border-default)"></span></button>
<div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px 10px"><p role="status" aria-live="polite" style="margin:0;font-size:16px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ countTxt }}</p><button type="button" onClick="{{ toggleList }}" style="flex:none;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--text-link);font:600 15px/1 var(--font-body);cursor:pointer">{{ listLabel }}</button></div>
<sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}"><div style="padding:0 16px 12px"><dc-import name="McCard" a="{{ selA }}" layout="row" on-open="{{ open }}" hint-size="100%,140px"></dc-import></div></sc-if>
<sc-if value="{{ isExpanded }}" hint-placeholder-val="{{ false }}"><div style="flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:20px"><sc-for list="{{ res }}" as="a" hint-placeholder-count="4"><dc-import name="McCard" a="{{ a }}" layout="row" on-open="{{ open }}" hint-size="100%,140px"></dc-import></sc-for></div></sc-if>
</section></sc-if>
</div>
<sc-if value="{{ fOpen }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;justify-content:{{ fJ }};align-items:center;padding:{{ fPad }}"><div onClick="{{ closeF }}" aria-hidden="true" style="position:absolute;inset:0;background:var(--dr-scrim)"></div><div role="dialog" aria-modal="true" aria-labelledby="mc-f-t" style="position:relative;width:{{ fW }};height:{{ fH }};border-radius:{{ fR }};overflow:hidden;box-shadow:var(--shadow-lg)"><dc-import name="McFilterSheet" f="{{ f }}" count="{{ count }}" mode="{{ fMode }}" safe="{{ safe }}" on-change="{{ patch }}" on-clear="{{ clear }}" on-close="{{ closeF }}" hint-size="100%,100%" style="height:100%"></dc-import></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;m&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;safe&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;init&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id)=&gt;void&quot;}}">
class Component extends DCLogic {
  constructor(p) { super(p); const i = p.init || {}; this.state = { sheet: i.sheet || 'collapsed', sel: i.sel || '', panned: !!i.panned, fOpen: !!i.filters, f: { role: 'photo', prov: 'Thành phố Hồ Chí Minh', date: '', time: '', styles: [], services: [], budget: '', rating: '' } }; }
  renderVals() {
    const D = window.mcData, m = !!this.props.m, safe = this.props.safe || 0, { sheet, sel, f } = this.state;
    const res = D.providers.filter(a => D.match(a, f));
    const XY = [[30, 46], [62, 40], [46, 62], [24, 70], [70, 66], [52, 34], [36, 56], [78, 50], [58, 74], [44, 44], [20, 40], [68, 30]];
    const selA = res.find(a => a.id === sel) || res[0] || null;
    const short = n => n == null ? 'Hỏi giá' : n >= 1e9 ? (n / 1e9).toFixed(n % 1e9 ? 2 : 0).replace('.', ',') + ' tỷ' : (n / 1e6).toFixed(n % 1e6 ? 1 : 0).replace('.', ',') + 'tr';
    const H = { collapsed: 100, preview: 248, expanded: '78%' }[sheet];
    const sheetPx = typeof H === 'number' ? H + safe : null;
    const patch = p => this.setState(s => ({ f: { ...s.f, ...p } }));
    const unit = f.role ? (D.roles.find(r => r.k === f.role) || {}).label.toLowerCase() : 'provider';
    return {
      isMob: m, isDesk: !m, h: 'calc(100vh - ' + (this.props.hh || (m ? 56 : 64)) + 'px)', safe, provS: f.prov ? D.short(f.prov) : 'Mọi tỉnh/thành',
      roleItems: [{ k: '', label: 'Tất cả' }, ...D.roles.map(r => ({ k: r.k, label: r.short }))], role: f.role, pickRole: k => this.setState(s => ({ f: { ...s.f, role: k }, sel: '' })),
      marks: res.map((a, i) => { const on = selA && a.id === selA.id && (sheet === 'preview' || !m); const xy = XY[D.providers.indexOf(a) % XY.length]; return { x: xy[0] + '%', y: xy[1] + '%', price: short(a.from), on: on ? 'true' : 'false', isOn: on, z: on ? 5 : 1, bd: on ? '2px solid var(--brand-primary)' : '1px solid var(--border-default)', bg: on ? 'var(--brand-primary)' : 'var(--bg-surface)', fg: on ? 'var(--text-on-brand)' : 'var(--text-primary)', aria: `${a.name}, ${a.from != null ? 'từ ' + a.fromTxt : 'hỏi giá'}`, pick: () => this.setState({ sel: a.id, sheet: 'preview' }) }; }),
      countTxt: res.length ? `${res.length} ${unit} trong vùng đang xem` : `Không có ${unit} trong vùng này`,
      panned: this.state.panned, areaTop: m ? 128 : 16, searchArea: () => this.setState({ panned: false }),
      showCtrl: !(m && sheet === 'expanded'), ctrlBottom: m ? (sheetPx != null ? sheetPx + 12 : 0) : 24, locate: () => this.setState({ panned: true }),
      sheetH: typeof H === 'number' ? (H + safe) + 'px' : H, expanded: sheet === 'expanded' ? 'true' : 'false',
      handleAria: sheet === 'expanded' ? 'Thu gọn danh sách' : 'Mở rộng danh sách',
      cycle: () => this.setState({ sheet: sheet === 'expanded' ? 'collapsed' : 'expanded' }),
      toggleList: () => this.setState({ sheet: sheet === 'expanded' ? 'collapsed' : 'expanded' }), listLabel: sheet === 'expanded' ? 'Xem bản đồ' : 'Xem danh sách',
      isPreview: sheet === 'preview' && !!selA, isExpanded: sheet === 'expanded', selA, res: res.map(a => ({ ...a, hov: () => this.setState({ sel: a.id }) })),
      open: id => this.props.onOpen && this.props.onOpen(id),
      fOpen: this.state.fOpen, openF: () => this.setState({ fOpen: true }), closeF: () => this.setState({ fOpen: false }), f, count: res.length, patch, clear: () => patch({ styles: [], services: [], budget: '', rating: '', date: '' }),
      fMode: m ? 'sheet' : 'dialog', fJ: m ? 'flex-end' : 'center', fPad: m ? '0' : '24px', fW: m ? '100%' : 'min(640px,100%)', fH: m ? 'min(88vh,760px)' : 'min(720px,calc(100vh - 48px))', fR: m ? 'var(--fg-radius-xl) var(--fg-radius-xl) 0 0' : 'var(--fg-radius-lg)'
    };
  }
}
</script>
</body>
</html>
