    const albums = kind === 'costume' || empty ? [] : AL.slice(0, kind === 'photo' ? 4 : 2).map(([title, place, date, style, frame], i) => ({ id: 'al' + i, title, place, date, style, frame, count: 8, cover: img(`al${i}c`, 1200, 800), coverAlt: `Bìa album ${title}`, intro: i === 0 ? 'Hạnh và Tùng cưới vào một sáng tháng Chín ở Đà Lạt, sương dày tới 08:00. Chúng tôi đi bộ từ khách sạn ra đồi thông, rồi quay về khu vườn nhỏ cho tiệc trưa với 30 khách.' : 'Một buổi chụp ngắn, không kịch bản.', images: R.map(([a, b], k) => ({ src: img(`al${i}i${k}`, a >= b ? 1400 : Math.round(1400 * a / b), a >= b ? Math.round(1400 * b / a) : 1400), w: a >= b ? 1400 : Math.round(1400 * a / b), h: a >= b ? Math.round(1400 * b / a) : 1400, caption: caps[k] })) }));
