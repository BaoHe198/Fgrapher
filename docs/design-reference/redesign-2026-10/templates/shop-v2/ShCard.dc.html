<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article aria-labelledby="{{ hid }}" style="position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;color:var(--text-primary);font-family:var(--font-body)">
<a href="{{ href }}" onClick="{{ open }}" aria-labelledby="{{ hid }}" style="position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:var(--fg-radius-md);background:var(--bg-sunken);color:var(--text-secondary);text-decoration:none;overflow:hidden">
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ true }}"><span style="transform:rotate(-6deg);opacity:.9"><dc-import name="ShIcon" kind="{{ it.cat }}" size="{{ big }}" stroke="{{ 0.9 }}" hint-size="120px,120px"></dc-import></span></sc-if>
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--border-default);border-radius:var(--fg-radius-sm);color:var(--text-tertiary)"><dc-import name="ShIcon" kind="{{ it.cat }}" size="{{ 56 }}" stroke="{{ 1.2 }}" hint-size="56px,56px"></dc-import><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em">CHƯA CÓ ẢNH</span></span></sc-if>
<span style="position:absolute;left:10px;top:10px;padding:5px 8px;border-radius:4px;background:var(--bg-surface);font:700 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--text-primary)">{{ it.modeLabel }}</span>
<span style="position:absolute;right:10px;top:10px;font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--text-secondary)">{{ condUp }}</span>
<sc-if value="{{ out }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:10px;right:10px;bottom:10px;padding:8px;border:1.5px dashed var(--border-strong);border-radius:4px;background:var(--bg-surface);text-align:center;font:700 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--text-primary)">HẾT HÀNG</span></sc-if>
</a>
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<h3 id="{{ hid }}" style="margin:0;font:600 16px/1.3 var(--font-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"><span style="color:var(--text-secondary);font-weight:500">{{ it.brand }}</span> {{ it.model }}</h3>
<span style="font-size:13px;line-height:1.4;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.seller.name }} · {{ provShort }}</span>
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:4px;font-family:var(--font-mono);font-variant-numeric:tabular-nums">
<sc-if value="{{ hasPrice }}" hint-placeholder-val="{{ true }}"><strong style="font-size:16px">{{ it.priceTxt }}</strong></sc-if>
<sc-if value="{{ hasRent }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px"><strong>{{ it.rentTxt }}</strong><span style="color:var(--text-secondary)">/ngày</span></span></sc-if>
</div>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;it&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Item&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;sell&quot;,&quot;rent&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;small&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const it = this.props.it || { seller: {} }, m = this.props.mode || 'all';
    return {
      it, hid: 'shc-' + it.id, href: '#' + it.id, open: e => { e.preventDefault(); this.props.onOpen && this.props.onOpen(it.id); },
      hasPhoto: !it.noPhoto, noPhoto: !!it.noPhoto, big: this.props.small ? 96 : 132, condUp: (it.condLabel || '').toUpperCase(), out: it.stock === 0,
      provShort: (it.prov || '').replace('Thành phố ', 'TP. '),
      hasPrice: !!it.price && m !== 'rent', hasRent: !!it.rent && m !== 'sell'
    };
  }
}
</script>
</body>
</html>
