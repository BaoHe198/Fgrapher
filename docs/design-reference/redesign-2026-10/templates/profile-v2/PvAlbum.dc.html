<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article ref="{{ rootRef }}" data-surface="darkroom" aria-labelledby="pv-al-t" style="min-height:100vh;background:var(--dr-bg);color:var(--dr-text);font-family:var(--font-body)">
<div style="position:sticky;top:0;z-index:10;background:var(--dr-bg);border-bottom:1px solid var(--dr-line)"><div style="max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,48px);height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px"><button type="button" onClick="{{ back }}" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;color:var(--dr-text);font:600 15px/1 var(--font-body);cursor:pointer">‹ {{ artist }}</button><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ bar }}</span><sc-if value="{{ canBook }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Fgrapher.Button" variant="accent" size="sm" on-click="{{ book }}">Đặt lịch</x-import></sc-if></div></div>
<header style="max-width:1200px;margin:0 auto;padding:clamp(40px,7vw,112px) clamp(16px,4vw,48px) clamp(32px,5vw,72px);display:flex;flex-direction:column;gap:20px"><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">ALBUM · KHUNG {{ a.frame }}</span><h1 id="pv-al-t" lang="vi" style="margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(40px,calc(12px + 5vw),104px);line-height:.94;letter-spacing:-.035em;text-wrap:balance">{{ a.title }}</h1><span style="font-size:15px;color:var(--dr-text-2)">{{ a.place }} · {{ a.date }} · {{ a.style }} · {{ a.count }} ảnh</span><p style="margin:0;max-width:640px;font:400 clamp(17px,1.4vw,20px)/1.6 var(--font-body);color:var(--dr-text);text-wrap:pretty">{{ a.intro }}</p></header>
<div ref="{{ seqRef }}" style="display:flex;flex-direction:column;gap:clamp(40px,7vw,120px);padding:0 clamp(12px,4vw,48px) clamp(64px,8vw,120px)">
<sc-for list="{{ blocks }}" as="b" hint-placeholder-count="5">
<sc-if value="{{ b.isFull }}" hint-placeholder-val="{{ true }}"><figure style="margin:0 auto;width:100%;max-width:1320px;display:flex;flex-direction:column;gap:12px"><button type="button" onClick="{{ b.open0 }}" aria-label="Xem lớn khung {{ b.n0 }}" style="display:block;padding:0;border:0;background:none;cursor:zoom-in"><img data-dev="" data-i="{{ b.i0 }}" data-caption="{{ b.c0 }}" data-cover-dest="{{ b.first }}" src="{{ b.s0 }}" width="{{ b.w0 }}" height="{{ b.h0 }}" alt="{{ b.c0 }}" style="display:block;width:100%;height:auto;max-height:92vh;object-fit:contain"></button><figcaption style="display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--dr-text-2)"><span style="flex:none;font:600 12px/1.6 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ b.n0 }}</span><span>{{ b.c0 }}</span></figcaption></figure></sc-if>
<sc-if value="{{ b.isPair }}" hint-placeholder-val="{{ false }}"><div style="margin:0 auto;width:100%;max-width:1200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(12px,2vw,24px);align-items:end"><figure style="margin:0;display:flex;flex-direction:column;gap:12px"><button type="button" onClick="{{ b.open0 }}" aria-label="Xem lớn khung {{ b.n0 }}" style="display:block;padding:0;border:0;background:none;cursor:zoom-in"><img data-dev="" data-i="{{ b.i0 }}" data-caption="{{ b.c0 }}" src="{{ b.s0 }}" width="{{ b.w0 }}" height="{{ b.h0 }}" alt="{{ b.c0 }}" loading="lazy" style="display:block;width:100%;height:auto"></button><figcaption style="display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--dr-text-2)"><span style="flex:none;font:600 12px/1.6 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ b.n0 }}</span><span>{{ b.c0 }}</span></figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;gap:12px"><button type="button" onClick="{{ b.open1 }}" aria-label="Xem lớn khung {{ b.n1 }}" style="display:block;padding:0;border:0;background:none;cursor:zoom-in"><img data-dev="" data-i="{{ b.i1 }}" data-caption="{{ b.c1 }}" src="{{ b.s1 }}" width="{{ b.w1 }}" height="{{ b.h1 }}" alt="{{ b.c1 }}" loading="lazy" style="display:block;width:100%;height:auto"></button><figcaption style="display:flex;gap:12px;font-size:14px;line-height:1.5;color:var(--dr-text-2)"><span style="flex:none;font:600 12px/1.6 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ b.n1 }}</span><span>{{ b.c1 }}</span></figcaption></figure></div></sc-if>
<sc-if value="{{ b.isInset }}" hint-placeholder-val="{{ false }}"><figure style="margin:0 auto;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(16px,3vw,48px);align-items:end"><button type="button" onClick="{{ b.open0 }}" aria-label="Xem lớn khung {{ b.n0 }}" style="grid-column:span 2;display:block;padding:0;border:0;background:none;cursor:zoom-in;max-width:720px"><img data-dev="" data-i="{{ b.i0 }}" data-caption="{{ b.c0 }}" src="{{ b.s0 }}" width="{{ b.w0 }}" height="{{ b.h0 }}" alt="{{ b.c0 }}" loading="lazy" style="display:block;width:100%;height:auto"></button><figcaption style="display:flex;flex-direction:column;gap:10px;padding-bottom:8px"><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">{{ b.n0 }}</span><span style="font:400 17px/1.6 var(--font-body);color:var(--dr-text);text-wrap:pretty">{{ b.c0 }}</span></figcaption></figure></sc-if>
</sc-for>
</div>
<footer style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px) clamp(64px,8vw,120px);display:flex;flex-direction:column;gap:28px"><div aria-hidden="true" style="display:flex;justify-content:space-between;padding-top:16px;border-top:1px solid var(--dr-line-2);font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)"><span>HẾT ALBUM</span><span>{{ lastFrame }}</span></div><div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px"><div style="display:flex;flex-direction:column;gap:8px"><strong style="font:600 clamp(24px,2.4vw,36px)/1.1 var(--font-display);letter-spacing:-.02em">Muốn có một album như thế này?</strong><span style="font-size:15px;color:var(--dr-text-2)">Gửi yêu cầu cho {{ artist }}. Đặt cọc thỏa thuận trực tiếp với nghệ sĩ.</span></div><div style="display:flex;flex-wrap:wrap;gap:10px"><sc-if value="{{ canBook }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Fgrapher.Button" variant="accent" size="lg" on-click="{{ book }}">Đặt lịch</x-import></sc-if><x-import component-from-global-scope="Fgrapher.Button" variant="outline" size="lg">Nhắn tin</x-import></div></div>
<sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ goNext }}" style="display:flex;align-items:center;gap:16px;padding:12px;border:1px solid var(--dr-line-2);border-radius:var(--fg-radius-md);background:var(--dr-surface);color:var(--dr-text);text-align:left;cursor:pointer"><img src="{{ nx.cover }}" alt="" style="width:96px;height:64px;object-fit:cover;display:block"><span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">ALBUM TIẾP THEO</span><strong style="font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ nx.title }}</strong></span></button></sc-if>
</footer>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;album&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Album&quot;},&quot;artist&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;photo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;next&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Album|null&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onBook&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onNext&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;}}">
class Component extends DCLogic {
  rootRef = React.createRef(); seqRef = React.createRef();
  componentDidMount() { window.scrollTo(0, 0); }
  open(e) {
    const im = e.currentTarget.querySelector('img'), g = [...this.seqRef.current.querySelectorAll('img')].sort((a, b) => a.dataset.i - b.dataset.i), a = this.props.album || {};
    window.fgKit && window.fgKit.lightbox(im, { group: g, meta: (i, c, len) => `KHUNG ${String(i + 1).padStart(2, '0')} / ${String(len).padStart(2, '0')} · ${a.title} · ${a.style}`.toUpperCase() });
  }
  renderVals() {
    const a = this.props.album || { images: [] }, imgs = a.images || [];
    const num = i => a.frame + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i % 26];
    const pat = ['full', 'pair', 'inset', 'full', 'pair'];
    const blocks = []; let i = 0, k = 0;
    while (i < imgs.length) { const t = pat[k++ % pat.length]; const take = t === 'pair' && i + 1 < imgs.length ? 2 : 1; const b = { isFull: t === 'full' || (t === 'pair' && take === 1), isPair: t === 'pair' && take === 2, isInset: t === 'inset', first: i === 0 ? '1' : '0' }; for (let j = 0; j < take; j++) { const im = imgs[i + j]; Object.assign(b, { ['s' + j]: im.src, ['w' + j]: im.w, ['h' + j]: im.h, ['c' + j]: im.caption, ['n' + j]: num(i + j), ['i' + j]: i + j, ['open' + j]: e => this.open(e) }); } blocks.push(b); i += take; }
    const nx = this.props.next;
    return {
      rootRef: this.rootRef, seqRef: this.seqRef, a, artist: this.props.artist || '', bar: `KHUNG ${a.frame} · ${String(imgs.length).padStart(2, '0')} ẢNH`,
      blocks, lastFrame: imgs.length ? num(imgs.length - 1) : '', canBook: this.props.kind !== 'costume',
      back: () => this.props.onBack && this.props.onBack(), book: () => this.props.onBook && this.props.onBook(),
      hasNext: !!nx, nx: nx || {}, goNext: () => this.props.onNext && this.props.onNext(nx.id)
    };
  }
}
</script>
</body>
</html>
