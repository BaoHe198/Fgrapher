<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="ab-story" data-surface="darkroom" aria-labelledby="ab-story-t" style="background:var(--dr-bg);color:var(--dr-text)">
<div style="max-width:1440px;margin:0 auto;padding:clamp(56px,7vw,112px) clamp(20px,4vw,64px) clamp(40px,5vw,80px);display:flex;flex-direction:column;gap:clamp(24px,4vw,48px)">
<div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)">CÁCH FGRAPHER LÀM VIỆC</span><h2 id="ab-story-t" style="margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(32px,calc(16px + 2.6vw),56px);line-height:1.02;letter-spacing:-.025em;text-wrap:balance">Bốn khung hình, bốn chỗ hay vướng khi thuê người chụp</h2></div>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,5vw,80px);align-items:start">
<div style="display:flex;flex-direction:column">
<sc-for list="{{ chapters }}" as="c" hint-placeholder-count="4"><article data-ch="{{ c.i }}" aria-labelledby="{{ c.hid }}" style="min-height:min(88vh,860px);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:40px 0">
<span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-accent)">{{ c.eyebrow }}</span>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dr-text-3)">Vấn đề</span><h3 id="{{ c.hid }}" style="margin:0;font:500 clamp(24px,2.2vw,32px)/1.2 var(--font-display);letter-spacing:-.015em;color:var(--dr-text-2);text-wrap:pretty">{{ c.problem }}</h3></div>
<div style="display:flex;flex-direction:column;gap:8px;padding-top:20px;border-top:1px solid var(--dr-line)"><span style="font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dr-text-3)">Fgrapher</span><p style="margin:0;font:400 19px/1.55 var(--font-body);color:var(--dr-text);text-wrap:pretty">{{ c.solution }}</p></div>
</article></sc-for>
</div>
<div style="position:sticky;top:84px;height:min(calc(100vh - 116px),780px);min-height:520px;display:flex;flex-direction:column;gap:14px">
<div role="img" aria-label="{{ sheetLabel }}" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;padding:2px;background:var(--dr-line)">
<sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="12"><div style="position:relative;aspect-ratio:1;display:grid;place-items:center;padding:3px;background:var(--dr-surface)"><img data-thumb="{{ t.i }}" src="{{ t.src }}" alt="" style="display:block;max-width:100%;max-height:100%"><sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:-1px;border:2px solid var(--dr-accent);border-radius:999px;pointer-events:none"></span></sc-if></div></sc-for>
</div>
<div style="display:flex;justify-content:space-between;gap:12px;font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)"><span>{{ stageNum }}</span><span>{{ stageCount }}</span></div>
<div style="position:relative;flex:1;min-height:0;display:grid;place-items:center;background:var(--dr-surface);border:1px solid var(--dr-line)">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:24px;background:var(--dr-raised)"></span></sc-if>
<img ref="{{ bigRef }}" data-dev="" src="{{ bigSrc }}" width="{{ bigW }}" height="{{ bigH }}" alt="{{ bigAlt }}" style="display:block;max-width:calc(100% - 48px);max-height:calc(100% - 48px);width:auto;height:auto;box-shadow:0 0 0 1px var(--dr-line)">
</div>
</div>
</div>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="position:sticky;top:60px;z-index:5;display:flex;flex-direction:column;gap:8px;margin:0 -20px;padding:10px 20px;background:var(--dr-bg);border-bottom:1px solid var(--dr-line)">
<div aria-hidden="true" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px">
<sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="12"><div style="position:relative;aspect-ratio:1;display:grid;place-items:center;background:var(--dr-surface)"><img src="{{ t.src }}" alt="" style="display:block;max-width:100%;max-height:100%"><sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border:2px solid var(--dr-accent);border-radius:999px"></span></sc-if></div></sc-for>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:56px;padding-top:24px">
<sc-for list="{{ chapters }}" as="c" hint-placeholder-count="4"><article data-ch="{{ c.i }}" aria-labelledby="{{ c.hidm }}" style="display:flex;flex-direction:column;gap:16px">
<span style="font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-accent)">{{ c.eyebrow }}</span>
<div style="display:grid;place-items:center;aspect-ratio:1;padding:12px;background:var(--dr-surface);border:1px solid var(--dr-line)"><sc-if value="{{ c.ok }}" hint-placeholder-val="{{ true }}"><img data-dev="" src="{{ c.src }}" width="{{ c.w }}" height="{{ c.h }}" alt="{{ c.alt }}" loading="lazy" style="display:block;max-width:100%;max-height:100%;width:auto;height:auto"></sc-if><sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:100%;height:100%;background:var(--dr-raised)"></span></sc-if></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dr-text-3)">Vấn đề</span><h3 id="{{ c.hidm }}" style="margin:0;font:500 22px/1.25 var(--font-display);color:var(--dr-text-2);text-wrap:pretty">{{ c.problem }}</h3></div>
<div style="display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--dr-line)"><span style="font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dr-text-3)">Fgrapher</span><p style="margin:0;font:400 17px/1.55 var(--font-body);text-wrap:pretty">{{ c.solution }}</p></div>
</article></sc-for>
</div>
</sc-if>
</div>
<div aria-hidden="true" style="position:relative;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,64px);background:var(--dr-bg);font:600 12px/1 var(--font-mono);letter-spacing:.12em;color:var(--dr-text-3)"><span style="position:absolute;left:0;right:0;top:4px;height:4px;background:repeating-linear-gradient(90deg,var(--dr-line-2) 0 8px,transparent 8px 20px)"></span><span>◂ 02F</span><span>HAI LỐI ĐI</span><span style="position:absolute;left:0;right:0;bottom:4px;height:4px;background:repeating-linear-gradient(90deg,var(--dr-line-2) 0 8px,transparent 8px 20px)"></span></div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;loading&quot;,&quot;long&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;isMobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { ch: 0 };
  bigRef = React.createRef();
  componentDidMount() { this.observe(); }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  observe() {
    this.io && this.io.disconnect();
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const i = +e.target.dataset.ch; if (i !== this.state.ch) this.setState({ ch: i }); } }), { rootMargin: '-45% 0px -45% 0px' });
    setTimeout(() => document.querySelectorAll('#ab-story [data-ch]').forEach(n => this.io.observe(n)), 50);
  }
  componentDidUpdate(pp, ps) {
    if (pp.isMobile !== this.props.isMobile) this.observe();
    if (ps.ch === this.state.ch || this.props.isMobile) return;
    const k = window.fgKit, big = this.bigRef.current, th = document.querySelector(`#ab-story [data-thumb="${this.frames[this.state.ch]}"]`);
    if (!k || !big || !th || k.reduced()) return;
    this.anim && this.anim.cancel();
    big.style.visibility = 'hidden';
    k.morph(th, big, { duration: 300, onDone: () => { big.style.visibility = ''; this.anim = big.animate([{ opacity: 0, filter: 'blur(6px) saturate(.3)' }, { opacity: 1, filter: 'blur(0) saturate(1)' }], { duration: 400, easing: 'cubic-bezier(0,0,.2,1)' }); } });
  }
  renderVals() {
    const st = this.props.state || '', long = st === 'long', loading = st === 'loading';
    const R = [[3, 2], [2, 3], [4, 5], [1, 1], [2, 3], [4, 5], [3, 2], [16, 9], [4, 5], [1, 1], [2, 3], [3, 2]];
    const size = i => { const [a, b] = R[i], L = 720; return a >= b ? [L, Math.round(L * b / a)] : [Math.round(L * a / b), L]; };
    const src = i => { const [w, h] = size(i); return `https://picsum.photos/seed/fgab-${i}/${w}/${h}`; };
    const roles = ['NHIẾP ẢNH', 'QUAY PHIM', 'TRANG ĐIỂM', 'STUDIO', 'NGƯỜI MẪU', 'THUÊ TRANG PHỤC'];
    const num = i => '0' + (1 + Math.floor(i / 6)) + 'ABCDEF'[i % 6];
    this.frames = [0, 2, 9, 11];
    const C = [
      ['Tìm người chụp qua bài đăng trong nhóm, không biết ai đứng sau tài khoản.', 'Mọi nghệ sĩ xác minh danh tính trước khi hồ sơ được công khai. Bạn tìm theo khu vực, phong cách và ngày còn trống.', 'Cô dâu dưới mưa ở Hội An'],
      ['Ảnh mẫu rải rác nhiều nơi, bị cắt cho vừa khung, khó biết đâu là ảnh của ai.', 'Portfolio nằm trong một hồ sơ, giữ nguyên khung hình người chụp đã chọn và được duyệt trước khi hiển thị.', 'Chuyên viên trang điểm cho cô dâu'],
      ['Nhắn qua lại nhiều ngày mới chốt được giờ, giá và địa điểm.', 'Bạn gửi một yêu cầu gồm ngày, giờ, địa điểm và ghi chú. Nghệ sĩ xác nhận trong 48 giờ. Đặt cọc thỏa thuận trực tiếp với nghệ sĩ.', 'Studio chụp sản phẩm'],
      ['Đánh giá không rõ ai viết, có khi là người chưa từng thuê.', 'Chỉ khách đã chụp xong buổi đặt qua Fgrapher mới viết được đánh giá. Nghệ sĩ có thể phản hồi công khai.', 'Áo dài Tết']
    ];
    if (long) C[2][1] = 'Bạn gửi một yêu cầu gồm ngày, giờ, địa điểm, số người, phong cách mong muốn và ảnh tham khảo. Nghệ sĩ xác nhận trong 48 giờ, hoặc đề xuất giờ khác nếu lịch đã kín. Mọi trao đổi về giá, số ảnh giao và thời gian chỉnh sửa nằm trong cùng một cuộc trò chuyện. Đặt cọc thỏa thuận trực tiếp với nghệ sĩ.';
    const ch = this.state.ch, fi = this.frames[ch], [bw, bh] = size(fi);
    return {
      isDesktop: !this.props.isMobile, isMobile: !!this.props.isMobile, loading,
      chapters: C.map(([problem, solution, alt], i) => { const f = this.frames[i], [w, h] = size(f); return { i, hid: 'ab-ch' + i, hidm: 'ab-chm' + i, problem, solution, alt, src: src(f), w, h, ok: !loading, eyebrow: `CHƯƠNG 0${i + 1} · KHUNG ${num(f)} · ${roles[f % 6]}` }; }),
      thumbs: R.map((_, i) => ({ i, src: src(i), on: i === fi })),
      sheetLabel: `Contact sheet, khung ${num(fi)} đang được chọn`,
      stageNum: `KHUNG ${num(fi)} · ${roles[fi % 6]}`, stageCount: `CHƯƠNG 0${ch + 1}/04`,
      bigRef: this.bigRef, bigSrc: src(fi), bigW: bw, bigH: bh, bigAlt: C[ch][2]
    };
  }
}
</script>
</body>
</html>
