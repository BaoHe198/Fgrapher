<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:12px;min-width:0">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><div style="width:52px;height:52px;flex:none;border-radius:50%;overflow:hidden"><x-import component-from-global-scope="Fgrapher.Skeleton" class-name="h-full w-full rounded-none" hint-size="100%,100%"></x-import></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:16px;width:70%"><x-import component-from-global-scope="Fgrapher.Skeleton" class-name="h-full w-full" hint-size="100%,16px"></x-import></div><div style="height:12px;width:45%"><x-import component-from-global-scope="Fgrapher.Skeleton" class-name="h-full w-full" hint-size="100%,12px"></x-import></div></div></sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}"><img src="{{ avatar }}" alt="" style="width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;background:var(--bg-sunken);animation:bk-in 400ms ease-out both"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><strong style="font-size:15px;line-height:1.3;overflow-wrap:anywhere">{{ artist }}</strong><span style="font-size:13px;color:var(--text-secondary)"><span style="color:var(--brand-accent)">★</span> {{ rating }} · Đã xác minh</span></div></sc-if>
</div>
<dl style="margin:0;display:flex;flex-direction:column;border-top:1px solid var(--border-subtle)">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<div style="display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--border-subtle)">
<dt style="font-size:13px;color:var(--text-secondary)">{{ r.label }}</dt>
<sc-if value="{{ r.has }}" hint-placeholder-val="{{ true }}"><dd style="margin:0;font-size:14px;font-weight:600;line-height:1.45;overflow-wrap:anywhere">{{ r.value }}<sc-if value="{{ r.sub }}" hint-placeholder-val="{{ false }}"><span style="display:block;font-weight:400;font-size:13px;color:var(--text-secondary)">{{ r.sub }}</span></sc-if></dd></sc-if>
<sc-if value="{{ r.none }}" hint-placeholder-val="{{ false }}"><dd style="margin:0;font-size:14px;color:var(--text-tertiary)">Chưa chọn</dd></sc-if>
<sc-if value="{{ r.canEdit }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ r.edit }}" aria-label="Sửa {{ r.label }}" style="min-height:32px;padding:0 4px;border:0;background:none;color:var(--text-link);font:700 13px/1 var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px">Sửa</button></sc-if>
<sc-if value="{{ r.noEdit }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
</div>
</sc-for>
</dl>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
<span style="display:flex;flex-direction:column;gap:2px"><strong style="font-size:15px">Tổng dự kiến</strong><span style="font-size:12px;color:var(--text-secondary)">{{ totalNote }}</span></span>
<strong style="font-family:var(--font-display);font-size:24px;letter-spacing:-.01em;white-space:nowrap">{{ total }}</strong>
</div>
<div style="display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--fg-radius-md);background:var(--bg-sunken);font-size:13px;line-height:1.5">
<span style="display:flex;gap:10px"><span aria-hidden="true" style="flex:none;margin-top:6px;width:6px;height:6px;border-radius:50%;background:var(--brand-accent)"></span><span><strong>Chưa thanh toán trực tuyến</strong> — đặt cọc thỏa thuận trực tiếp với nghệ sĩ</span></span>
<span style="display:flex;gap:10px"><span aria-hidden="true" style="flex:none;margin-top:6px;width:6px;height:6px;border-radius:50%;background:var(--brand-accent)"></span><span>Nghệ sĩ phản hồi trong 48 giờ</span></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;artist&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Minh Anh Nhiếp Ảnh&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4,9 (128)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,value,sub,edit}[]&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5.500.000₫&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Giá cuối cùng chốt khi nghệ sĩ xác nhận&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;editable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const rows = (p.rows || []).map(r => ({ ...r, has: !!r.value, none: !r.value, canEdit: !!p.editable && !!r.edit, noEdit: !(p.editable && r.edit) }));
    return { loading: !!p.loading, ready: !p.loading, avatar: p.avatar, artist: p.artist || 'Minh Anh Nhiếp Ảnh', rating: p.rating || '4,9 (128)', rows, total: p.total || '—', totalNote: p.totalNote || 'Giá cuối cùng chốt khi nghệ sĩ xác nhận' };
  }
}
</script>
</body>
</html>
