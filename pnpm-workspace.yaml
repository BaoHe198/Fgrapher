overrides:
  # GHSA-ggr8-5vv4-36mx — stack exhaustion (DoS) merging recursive object
  # graphs, patched >=8.0.0. Pulled in transitively by Prisma's own CLI
  # tooling (@prisma/config), not part of this app's runtime request path
  # (never processes untrusted input from a live request) — low real
  # exploitability here, but a one-line override with no functional
  # downside once confirmed `prisma generate`/`db:migrate:dev` still work.
  deepmerge-ts: ">=8.0.0"
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp (4 high) — host-confusion/SSRF bugs in fast-uri's
  # URI parsing, patched >=3.1.6. Pulled in via ajv, used by
  # @hookform/resolvers' zodResolver (a real runtime dependency — every
  # form in this app) as well as commitlint/@sentry/nextjs's build
  # tooling/shadcn's dev-only MCP SDK. Confirmed 3.1.5 (vulnerable) was
  # the resolved version before this override.
  fast-uri: ">=3.1.6"
  # GHSA-x5fp-wj9c-mxmx (moderate, array-limit bypass), GHSA-4mjr-xmp4-gh2g
  # (moderate, DoS via attacker-controlled isBuffer) — patched >=6.16.0.
  # Pulled in via twilio (a real runtime dependency, src/lib/sms.ts) and
  # shadcn's dev-only MCP SDK/express. Confirmed 6.15.3 (vulnerable) was
  # the resolved version before this override.
  qs: ">=6.16.0"
allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  # False, not true — @sentry/cli's postinstall fetches a platform binary
  # used only by @sentry/nextjs's build-time source-map-upload plugin
  # (withSentryConfig), which this app deliberately doesn't use (see
  # src/instrumentation.ts's comment) in favor of manual instrumentation.
  # ts/instrumentation-client.ts wiring — safer against this fork's
  # customized build pipeline. Revisit if source-map upload is added later.
  "@sentry/cli": false
  "@swc/core": true
  esbuild: true
  prisma: true
  unrs-resolver: true
